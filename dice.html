<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze - Dice</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f121b; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .navbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0f121b; }
        .logo-text { color: #f12c4c; font-weight: 900; font-size: 24px; }
        .balance-box { background: #1a1d23; padding: 8px 12px; border-radius: 4px; border: 1px solid #242931; color: #00ff7f; font-weight: bold; }

        .game-card { background: #1a1d23; width: 90%; max-width: 400px; padding: 40px 20px; border-radius: 12px; border: 1px solid #242931; margin-top: 20px; text-align: center; position: relative; }
        
        /* NÚMERO SORTEADO COM ANIMAÇÃO */
        #dice-result { font-size: 80px; font-weight: 900; color: #f12c4c; margin: 10px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 20px rgba(241, 44, 76, 0.3); }
        
        .label-target { color: #98a7b5; font-size: 14px; margin-bottom: 10px; }
        .slider { width: 100%; height: 8px; background: #242931; border-radius: 5px; outline: none; margin: 25px 0; accent-color: #f12c4c; }

        /* WIN TOAST (O BOTÃO VERDE DE VITÓRIA) */
        #win-toast { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: #00ff7f; color: #000; padding: 25px 40px; border-radius: 60px;
            font-weight: 900; font-size: 20px; z-index: 100; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 40px #00ff7f; pointer-events: none; text-align: center; line-height: 1.2;
        }
        #win-toast.show { transform: translate(-50%, -50%) scale(1); }

        .controls { width: 90%; max-width: 400px; margin-top: 20px; }
        .label { color: #98a7b5; font-size: 12px; margin-bottom: 5px; }
        input { width: 100%; padding: 15px; background: #1a1d23; border: 1px solid #242931; color: white; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        
        .btn-play { width: 100%; padding: 20px; background: #f12c4c; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .btn-play:disabled { opacity: 0.5; filter: grayscale(0.5); }

        .back-link { margin-top: 30px; color: #98a7b5; text-decoration: none; font-size: 14px; display: block; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-text">blaze</div>
        <div class="balance-box">R$ <span id="s-val">0,00</span></div>
    </div>

    <div class="game-card">
        <div id="win-toast">GANHOU R$<br><span id="win-amount">0.00</span>!</div>
        
        <div class="label-target">Abaixo de: <span id="target-display">50</span></div>
        <div id="dice-result">--</div>
        <input type="range" min="2" max="98" value="50" class="slider" id="dice-slider">
    </div>

    <div class="controls">
        <div class="label">Aposta (Mín R$ 1,00)</div>
        <input type="number" id="aposta" value="1.00" min="1.00" step="1.00">
        <button class="btn-play" id="btn-roll" onclick="playDice()">Jogar</button>
    </div>

    <a href="home.html" class="back-link">← Voltar para a Home</a>

    <script>
        let saldo = parseFloat(localStorage.getItem('saldo')) || 100.00;
        const resultDiv = document.getElementById('dice-result');
        const slider = document.getElementById('dice-slider');
        const targetDisplay = document.getElementById('target-display');

        slider.oninput = function() { targetDisplay.innerText = this.value; }

        function updateDisplay() {
            localStorage.setItem('saldo', saldo.toFixed(2));
            document.getElementById('s-val').innerText = saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        }

        function playDice() {
            const bet = parseFloat(document.getElementById('aposta').value);
            const target = parseInt(slider.value);
            const btn = document.getElementById('btn-roll');

            if (bet < 1 || bet > saldo) return;

            saldo -= bet;
            updateDisplay();
            btn.disabled = true;

            // ANIMAÇÃO DOS NÚMEROS GIRANDO
            let counter = 0;
            const duration = 1500; // 1.5 segundos girando
            const interval = setInterval(() => {
                resultDiv.innerText = Math.floor(Math.random() * 100);
            }, 50);

            setTimeout(() => {
                clearInterval(interval);
                const finalResult = Math.floor(Math.random() * 100);
                resultDiv.innerText = finalResult;

                if (finalResult < target) {
                    const multiplier = 98 / target;
                    const win = bet * multiplier;
                    saldo += win;
                    
                    // MOSTRAR ANIMAÇÃO DE VITÓRIA
                    const toast = document.getElementById('win-toast');
                    document.getElementById('win-amount').innerText = win.toFixed(2);
                    toast.classList.add('show');
                    
                    setTimeout(() => {
                        toast.classList.remove('show');
                        updateDisplay();
                        btn.disabled = false;
                    }, 2000);
                } else {
                    updateDisplay();
                    btn.disabled = false;
                }
            }, duration);
        }

        window.onload = updateDisplay;
    </script>
</body>
</html>
