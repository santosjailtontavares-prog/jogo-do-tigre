<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze - Double</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f121b; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .navbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0f121b; border-bottom: 1px solid #1a1d23; }
        .logo-text { color: #f12c4c; font-weight: 900; font-size: 24px; }
        .balance-box { background: #1a1d23; padding: 8px 12px; border-radius: 4px; border: 1px solid #242931; color: #00ff7f; font-weight: bold; }

        .roulette-container { width: 100%; background: #151921; padding: 45px 0; margin: 20px 0; position: relative; overflow: hidden; border-y: 1px solid #242931; }
        .selector { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: white; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px #fff; }
        
        .wheel { display: flex; will-change: transform; transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); }
        .tile { min-width: 70px; height: 70px; margin: 0 2px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        
        /* Padrão de Cores Oficial */
        .red { background: #f12c4c; }
        .white { background: #ffffff; color: #0f121b; }
        .black { background: #242931; }

        #win-toast { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: #00ff7f; color: #000; padding: 20px 40px; border-radius: 50px;
            font-weight: 900; z-index: 100; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px #00ff7f; pointer-events: none;
        }
        #win-toast.show { transform: translate(-50%, -50%) scale(1.1); }

        .controls { width: 90%; max-width: 400px; }
        .label { color: #98a7b5; font-size: 12px; margin-bottom: 5px; }
        input { width: 100%; padding: 15px; background: #1a1d23; border: 1px solid #242931; color: white; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        
        .bet-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-bet { padding: 20px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .btn-bet.disabled { opacity: 0.3; pointer-events: none; }

        .back-link { margin-top: 40px; color: #98a7b5; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div id="win-toast">GANHOU!</div>

    <div class="navbar">
        <div class="logo-text">blaze</div>
        <div class="balance-box">R$ <span id="s-val">0,00</span></div>
    </div>

    <div class="roulette-container">
        <div class="selector"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <div class="controls">
        <div class="label">Quantia da Aposta (Mín R$ 1,00)</div>
        <input type="number" id="aposta" value="1.00" min="1.00">
        
        <div class="bet-buttons">
            <button onclick="playDouble('red')" class="btn-bet red">2x</button>
            <button onclick="playDouble('white')" class="btn-bet white"></button>
            <button onclick="playDouble('black')" class="btn-bet black">2x</button>
        </div>
    </div>

    <a href="home.html" class="back-link">← Voltar para a Home</a>

    <script>
        let saldo = parseFloat(localStorage.getItem('saldo')) || 100.00;
        const wheel = document.getElementById('wheel');
        const tileWidth = 74; 
        
        // PADRÃO XADREZ: Vermelho e Preto alternados, com o Branco no início
        const sequence = [
            {n:0, c:'white'}, 
            {n:1, c:'red'}, {n:2, c:'black'}, {n:3, c:'red'}, {n:4, c:'black'}, 
            {n:5, c:'red'}, {n:6, c:'black'}, {n:7, c:'red'}, {n:8, c:'black'}, 
            {n:9, c:'red'}, {n:10, c:'black'}, {n:11, c:'red'}, {n:12, c:'black'}, 
            {n:13, c:'red'}, {n:14, c:'black'}
        ];

        function updateDisplay() {
            localStorage.setItem('saldo', saldo.toFixed(2));
            document.getElementById('s-val').innerText = saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        }

        function initWheel() {
            wheel.innerHTML = '';
            // Criar blocos repetidos para o efeito de giro
            for(let i=0; i<60; i++) {
                sequence.forEach(t => {
                    const div = document.createElement('div');
                    div.className = `tile ${t.c}`;
                    div.innerText = t.n === 0 ? 'B' : t.n;
                    wheel.appendChild(div);
                });
            }
            // Centralizar no primeiro Branco (B) da sequência do meio
            resetToCenter();
        }

        function resetToCenter() {
            const startTiles = 30 * sequence.length; // Ponto médio da wheel
            const stopPos = (startTiles * tileWidth) - (window.innerWidth / 2) + (tileWidth / 2);
            wheel.style.transition = 'none';
            wheel.style.transform = `translateX(-${stopPos}px)`;
        }

        function playDouble(chosenColor) {
            const bet = parseFloat(document.getElementById('aposta').value);
            if (bet < 1 || bet > saldo) return;

            saldo -= bet;
            updateDisplay();
            document.querySelectorAll('.btn-bet').forEach(b => b.classList.add('disabled'));

            // Sorteio
            const extraSpins = 20 * sequence.length;
            const targetIndex = Math.floor(Math.random() * sequence.length);
            const totalTiles = (30 * sequence.length) + targetIndex + extraSpins;
            const stopPos = (totalTiles * tileWidth) - (window.innerWidth / 2) + (tileWidth / 2);

            wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0, 0.1, 1)';
            wheel.style.transform = `translateX(-${stopPos}px)`;

            setTimeout(() => {
                const result = sequence[targetIndex];
                if (result.c === chosenColor) {
                    const win = bet * (chosenColor === 'white' ? 14 : 2);
                    saldo += win;
                    const toast = document.getElementById('win-toast');
                    toast.innerText = `GANHOU R$ ${win.toFixed(2)}!`;
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2500);
                }
                
                // Reposiciona para o centro sem animação para a próxima rodada
                setTimeout(() => {
                    updateDisplay();
                    document.querySelectorAll('.btn-bet').forEach(b => b.classList.remove('disabled'));
                    const finalTiles = (30 * sequence.length) + targetIndex;
                    const finalStop = (finalTiles * tileWidth) - (window.innerWidth / 2) + (tileWidth / 2);
                    wheel.style.transition = 'none';
                    wheel.style.transform = `translateX(-${finalStop}px)`;
                }, 1000);

            }, 4200);
        }

        window.onload = () => { updateDisplay(); initWheel(); };
        window.onresize = resetToCenter;
    </script>
</body>
</html>
