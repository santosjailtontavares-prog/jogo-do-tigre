        .card-jogo img { width: 100%; height: auto; display: block; border-bottom: 1px solid #333; }
        .card-jogo p { margin: 8px; font-size: 13px; text-align: center; font-weight: bold; }
        .categoria-titulo { margin: 20px 20px 5px 20px; font-size: 18px; color: #ffbc00; border-left: 4px solid #ffbc00; padding-left: 10px; }
