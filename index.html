<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Plataforma de Jogos</title>
    <style>
        body { background-color: #0b0b0b; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 2px solid #ffbc00; position: sticky; top: 0; z-index: 100; }
        .saldo-container { background: #333; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-top: 10px; }
        .grid-jogos { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card-jogo { background: #222; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s; cursor: pointer; }
        .card-jogo:hover { transform: scale(1.05); border-color: #ffbc00; }
        .card-jogo img { width: 100%; display: block; }
        .card-jogo p { margin: 8px; font-size: 13px; text-align: center; font-weight: bold; }
        .categoria-titulo { margin: 20px 20px 5px 20px; font-size: 18px; color: #ffbc00; border-left: 4px solid #ffbc00; padding-left: 10px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: bold;">🎰 MINHA PLATAFORMA</div>
    <div class="saldo-container">Saldo: <span style="color: #00ff00;">R$ 0,00</span></div>
</header>

<h2 class="categoria-titulo">Populares da PG SOFT</h2>
<div class="grid-jogos">
    <div class="card-jogo" onclick="window.location.href='https://m.pg-nmga.com/126/index.html?ot=3&l=pt&st=1'">
        <img src="https://static.pgsoft.com/fpg/images/games/126/icon.png">
        <p>Fortune Tiger</p>
    </div>
    <div class="card-jogo" onclick="window.location.href='https://m.pg-nmga.com/1543462/index.html?ot=3&l=pt&st=1'">
        <img src="https://static.pgsoft.com/fpg/images/games/1543462/icon.png">
        <p>Fortune Rabbit</p>
    </div>
    <div class="card-jogo" onclick="window.location.href='https://m.pg-nmga.com/98/index.html?ot=3&l=pt&st=1'">
        <img src="https://static.pgsoft.com/fpg/images/games/98/icon.png">
        <p>Fortune Ox</p>
    </div>
    <div class="card-jogo" onclick="window.location.href='https://m.pg-nmga.com/81/index.html?ot=3&l=pt&st=1'">
        <img src="https://static.pgsoft.com/fpg/images/games/81/icon.png">
        <p>Fortune Mouse</p>
    </div>
</div>

<div class="grid-jogos">
    <div class="card-jogo" onclick="window.location.href='https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=vs20olympgate&lang=pt'">
        <img src="https://img.prizelala.com/images/games/vs20olympgate.png" onerror="this.src='https://via.placeholder.com/150?text=Gates+of+Olympus'">
        <p>Gates of Olympus</p>
    </div>
    <div class="card-jogo" onclick="window.location.href='https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=vs20sugarbomb&lang=pt'">
        <img src="https://img.prizelala.com/images/games/vs20sugarbomb.png" onerror="this.src='https://via.placeholder.com/150?text=Sweet+Bonanza'">
        <p>Sweet Bonanza</p>
    </div>
</div>

<h2 class="categoria-titulo">Mais Procurados</h2>
<div class="grid-jogos">

</div>

<footer style="padding: 40px 20px; text-align: center; color: #444; font-size: 12px;">
    <p>© 2026 Minha Plataforma - Jogue com responsabilidade</p>
    <button onclick="window.location.href='carteira.html'" style="background: #ffbc00; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold;">DEPOSITAR AGORA</button>
</footer>

</body>
</html>
