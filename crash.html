<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze - Crash Pro + Histórico</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f121b; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* NAVBAR */
        .navbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0f121b; border-bottom: 1px solid #1a1d23; }
        .logo-text { color: #f12c4c; font-weight: 900; font-size: 24px; text-decoration: none; }
        .balance-box { background: #1a1d23; padding: 8px 12px; border-radius: 4px; border: 1px solid #242931; color: #00ff7f; font-weight: bold; }

        /* HISTÓRICO DE VELAS */
        .history-bar { width: 95%; max-width: 500px; display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .history-bar::-webkit-scrollbar { display: none; }
        .candle { min-width: 50px; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; text-align: center; background: #1a1d23; border: 1px solid #242931; }
        .candle.low { color: #98a7b5; } /* Abaixo de 2.0x */
        .candle.mid { color: #00ff7f; } /* Acima de 2.0x */
        .candle.high { color: #f12c4c; } /* Acima de 10.0x */

        /* ÁREA DO JOGO */
        .game-area { width: 95%; max-width: 500px; height: 300px; background: #0b0e15; margin: 5px 0 15px; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #1a1d23; }
        .multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: 900; z-index: 10; transition: color 0.3s; }
        .multiplier.crashed { color: #f12c4c; }
        
        #timer-msg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #f12c4c; font-weight: bold; font-size: 14px; background: rgba(241, 44, 76, 0.1); padding: 6px 15px; border-radius: 20px; z-index: 15; }
        #plane { position: absolute; bottom: 30px; left: 30px; font-size: 45px; z-index: 5; transition: transform 0.1s linear; }
        #svg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #trail { fill: none; stroke: #f12c4c; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 5px #f12c4c); }

        /* CONTROLES DE APOSTA DUPLA */
        .bet-container { width: 95%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .bet-box { background: #1a1d23; padding: 12px; border-radius: 12px; border: 1px solid #242931; display: flex; flex-direction: column; gap: 8px; }
        .bet-box input { background: #0f121b; border: 1px solid #242931; color: white; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; }
        .btn-bet { background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .btn-bet.active { background: #f12c4c; }
        .btn-bet.waiting { background: #3d4451; opacity: 0.8; }

        /* MENSAGEM DE GANHO */
        .win-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: #00ff7f; color: #000; padding: 15px 30px; border-radius: 50px; font-weight: 900; z-index: 100; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .win-toast.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <div id="win-msg" class="win-toast">GANHOU R$ <span id="win-val">0.00</span>!</div>

    <div class="navbar">
        <a href="home.html" class="logo-text">blaze</a>
        <div class="balance-box">R$ <span id="s-val">0,00</span></div>
    </div>

    <div class="history-bar" id="history-bar">
        </div>

    <div class="game-area">
        <div id="timer-msg">AGUARDANDO PRÓXIMA RODADA...</div>
        <div class="multiplier" id="mult-display">1.00x</div>
        <svg id="svg-canvas"><path id="trail" d="M 40 270 Q 40 270 40 270" /></svg>
        <div id="plane">🚀</div>
    </div>

    <div class="bet-container">
        <div class="bet-box">
            <input type="number" id="amt-1" value="1.00">
            <button class="btn-bet" id="btn-1" onclick="bet(1)">Apostar</button>
        </div>
        <div class="bet-box">
            <input type="number" id="amt-2" value="1.00">
            <button class="btn-bet" id="btn-2" onclick="bet(2)">Apostar</button>
        </div>
    </div>

    <script>
        let saldo = parseFloat(localStorage.getItem('saldo')) || 121.50;
        let state = 'timer';
        let currentMult = 1.00;
        let bets = { 1: { active: false, amt: 0 }, 2: { active: false, amt: 0 } };
        let history = [1.54, 2.10, 1.08, 12.45, 1.99]; // Histórico inicial

        function updateBalance() {
            document.getElementById('s-val').innerText = saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            localStorage.setItem('saldo', saldo.toFixed(2));
        }

        function renderHistory() {
            const bar = document.getElementById('history-bar');
            bar.innerHTML = '';
            history.forEach(val => {
                const candle = document.createElement('div');
                candle.className = 'candle ' + (val >= 10 ? 'high' : val >= 2 ? 'mid' : 'low');
                candle.innerText = val.toFixed(2) + 'x';
                bar.prepend(candle);
            });
        }

        function bet(slot) {
            const btn = document.getElementById(`btn-${slot}`);
            const val = parseFloat(document.getElementById(`amt-${slot}`).value);

            if (state === 'timer' && !bets[slot].active) {
                if (val > 0 && val <= saldo) {
                    saldo -= val;
                    bets[slot] = { active: true, amt: val };
                    btn.innerText = "Aguardando...";
                    btn.classList.add('waiting');
                    updateBalance();
                }
            } else if (state === 'fly' && bets[slot].active) {
                let win = bets[slot].amt * currentMult;
                saldo += win;
                bets[slot].active = false;
                btn.innerText = "Apostar";
                btn.classList.remove('active', 'waiting');
                
                const toast = document.getElementById('win-msg');
                document.getElementById('win-val').innerText = win.toFixed(2);
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
                updateBalance();
            }
        }

        function runTimer() {
            state = 'timer';
            let count = 5;
            const msg = document.getElementById('timer-msg');
            msg.style.display = 'block';
            
            let t = setInterval(() => {
                msg.innerText = `PRÓXIMA RODADA EM ${count}s`;
                count--;
                if (count < 0) {
                    clearInterval(t);
                    msg.style.display = 'none';
                    startFly();
                }
            }, 1000);
        }

        function startFly() {
            state = 'fly';
            currentMult = 1.00;
            const display = document.getElementById('mult-display');
            const plane = document.getElementById('plane');
            const path = document.getElementById('trail');
            display.classList.remove('crashed');

            [1, 2].forEach(s => {
                if (bets[s].active) {
                    const b = document.getElementById(`btn-${s}`);
                    b.innerText = "Retirar";
                    b.classList.remove('waiting');
                    b.classList.add('active');
                }
            });

            let crashAt = (Math.random() * 4 + 1.1).toFixed(2);
            let start = Date.now();

            let game = setInterval(() => {
                let time = (Date.now() - start) / 1000;
                currentMult = 1.00 + (time * 0.12); 
                display.innerText = currentMult.toFixed(2) + "x";

                let x = Math.min(time * 30, 300);
                let y = Math.min(time * 15, 180);
                plane.style.transform = `translate(${x}px, -${y}px)`;
                path.setAttribute('d', `M 40 270 Q ${40 + x/2} 270 ${40 + x} ${270 - y}`);

                if (currentMult >= crashAt) {
                    clearInterval(game);
                    state = 'crash';
                    display.innerText = "VOU EMBORA!";
                    display.classList.add('crashed');
                    
                    // Adiciona ao histórico
                    history.push(parseFloat(currentMult));
                    if(history.length > 10) history.shift();
                    renderHistory();

                    [1, 2].forEach(s => {
                        bets[s].active = false;
                        const b = document.getElementById(`btn-${s}`);
                        b.innerText = "Apostar";
                        b.classList.remove('active', 'waiting');
                    });

                    setTimeout(() => {
                        plane.style.transform = `translate(0,0)`;
                        path.setAttribute('d', `M 40 270 Q 40 270 40 270`);
                        display.innerText = "1.00x";
                        runTimer();
                    }, 3000);
                }
            }, 100);
        }

        updateBalance();
        renderHistory();
        runTimer();
    </script>
</body>
</html>
