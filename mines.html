<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze - Mines</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f121b; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* NAVBAR */
        .navbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0f121b; }
        .logo-text { color: #f12c4c; font-weight: 900; font-size: 24px; }
        .balance-box { background: #1a1d23; padding: 8px 12px; border-radius: 4px; border: 1px solid #242931; color: #00ff7f; font-weight: bold; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #1a1d23; padding: 15px; border-radius: 12px; border: 1px solid #242931; width: 90%; max-width: 400px; margin-top: 20px; }
        .cell { aspect-ratio: 1/1; background: #242931; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.2s; }
        .cell.revealed { background: #00ff7f33; border: 2px solid #00ff7f; box-shadow: 0 0 15px rgba(0, 255, 127, 0.2); }
        .cell.bomb { background: #f12c4c33; border: 2px solid #f12c4c; }

        /* WIN TOAST ANIMATION */
        #win-toast { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: #00ff7f; color: #000; padding: 20px 40px; border-radius: 50px;
            font-weight: 900; z-index: 1000; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px #00ff7f; pointer-events: none; text-transform: uppercase;
        }
        #win-toast.show { transform: translate(-50%, -50%) scale(1.1); }

        /* CONTROLES (Conforme Screenshot 12:17 PM) */
        .controls { width: 90%; max-width: 400px; margin-top: 25px; }
        .label { color: #98a7b5; font-size: 12px; margin-bottom: 5px; text-align: left; }
        input, select { width: 100%; padding: 15px; background: #1a1d23; border: 1px solid #242931; color: white; border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 16px; }
        
        .btn-play { width: 100%; padding: 18px; background: #f12c4c; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-play:active { transform: scale(0.98); }

        .back-link { margin-top: 30px; color: #98a7b5; text-decoration: none; font-size: 14px; display: block; }
    </style>
</head>
<body>

    <div id="win-toast">GANHOU!</div>

    <div class="navbar">
        <div class="logo-text">blaze</div>
        <div class="balance-box">R$ <span id="s-val">0,00</span></div>
    </div>

    <div class="grid" id="board"></div>

    <div class="controls">
        <div class="label">Aposta (Mín R$ 1,00)</div>
        <input type="number" id="aposta" value="1.00" min="1.00" step="1.00">
        
        <div class="label">Minas</div>
        <select id="minas-count">
            <option value="3">3 Minas</option>
            <option value="5">5 Minas</option>
            <option value="10">10 Minas</option>
            <option value="20">20 Minas</option>
        </select>

        <button id="btn-main" class="btn-play" onclick="startGame()">Começar Jogo</button>
    </div>

    <a href="home.html" class="back-link">← Voltar</a>

    <script>
        let saldo = parseFloat(localStorage.getItem('saldo')) || 100.00;
        let gameActive = false;
        let bombs = [];
        let revealedCount = 0;

        function updateDisplay() {
            localStorage.setItem('saldo', saldo.toFixed(2));
            document.getElementById('s-val').innerText = saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        }

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => revealCell(i, cell);
                board.appendChild(cell);
            }
        }

        function startGame() {
            const bet = parseFloat(document.getElementById('aposta').value);
            const numMinas = parseInt(document.getElementById('minas-count').value);

            if (bet < 1) return; // Aposta mínima de 1 real
            if (bet > saldo) return;

            saldo -= bet;
            updateDisplay();
            
            gameActive = true;
            revealedCount = 0;
            document.getElementById('btn-main').innerText = "Retirar";
            document.getElementById('btn-main').style.background = "#00ff7f";
            document.getElementById('btn-main').style.color = "#000";
            document.getElementById('btn-main').onclick = cashOut;
            
            bombs = [];
            while(bombs.length < numMinas) {
                let r = Math.floor(Math.random() * 25);
                if(!bombs.includes(r)) bombs.push(r);
            }
            createBoard();
        }

        function revealCell(idx, element) {
            if (!gameActive || element.classList.contains('revealed')) return;

            if (bombs.includes(idx)) {
                element.classList.add('bomb');
                element.innerText = '💣';
                gameActive = false;
                setTimeout(() => resetGame(), 1000);
            } else {
                element.classList.add('revealed');
                element.innerText = '💎';
                revealedCount++;
            }
        }

        function cashOut() {
            if (!gameActive || revealedCount === 0) return;
            
            const bet = parseFloat(document.getElementById('aposta').value);
            const profit = bet * (1 + (revealedCount * 0.25)); 
            
            saldo += profit;
            updateDisplay();
            
            // Animação de Vitória conforme o Double
            const toast = document.getElementById('win-toast');
            toast.innerText = `GANHOU R$ ${profit.toFixed(2)}!`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);

            resetGame();
        }

        function resetGame() {
            gameActive = false;
            document.getElementById('btn-main').innerText = "Começar Jogo";
            document.getElementById('btn-main').style.background = "#f12c4c";
            document.getElementById('btn-main').style.color = "#fff";
            document.getElementById('btn-main').onclick = startGame;
            createBoard();
        }

        window.onload = () => { updateDisplay(); createBoard(); };
    </script>
</body>
</html>
